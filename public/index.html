<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResilNet - AI Disaster Monitoring Dashboard</title>
    <!-- Leaflet GIS Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Chart.js for Live Telemetry -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-card: #151c28;
            --accent-green: #00e676;
            --accent-yellow: #ffea00;
            --accent-red: #ff1744;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 20px; min-height: 100vh; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; background: var(--bg-card); border-radius: 12px;
            border: 1px solid var(--border-color); margin-bottom: 20px;
        }

        .system-title { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.5px; }
        .system-title span { color: #38bdf8; }

        .status-badge {
            padding: 8px 18px; border-radius: 20px; font-weight: 700;
            font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase;
        }
        .NORMAL { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .WARNING { background: rgba(255, 234, 0, 0.15); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .CRITICAL_ALERT { background: rgba(255, 23, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .grid-layout {
            display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px;
        }

        .card {
            background: var(--bg-card); border-radius: 12px; padding: 20px;
            border: 1px solid var(--border-color);
        }

        .card-title { font-size: 1rem; color: var(--text-muted); margin-bottom: 15px; font-weight: 600; }

        /* Map Container Definition */
        #map { height: 380px; width: 100%; border-radius: 8px; z-index: 1; }

        .cam-feed {
            width: 100%; height: 280px; background: #000; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; border: 1px solid var(--border-color);
        }
        .cam-feed img { width: 100%; height: 100%; object-fit: cover; }

        .nodes-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;
        }

        .metric-row { display: flex; justify-content: space-between; margin: 10px 0; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .metric-value { font-weight: 700; color: #38bdf8; }

        .chart-container { height: 220px; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="system-title">ResilNet <span>Disaster Monitor</span></div>
        <div id="status-badge" class="status-badge NORMAL">System Operational</div>
    </header>

    <div class="grid-layout">
        <!-- Live Geo-Spatial Hazard Map Section -->
        <div class="card">
            <div class="card-title">LIVE GEO-SPATIAL HAZARD MAP</div>
            <div id="map"></div>
        </div>

        <!-- ESP32-CAM Surveillance Section -->
        <div class="card">
            <div class="card-title">ESP32-CAM SURVEILLANCE</div>
            <div class="cam-feed">
                <img id="cam-stream" src="http://192.168.1.100/stream" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300/0a0e17/94a3b8?text=ESP32-CAM+Offline';" alt="Live Camera Stream">
            </div>
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; text-align: center;">
                Camera Stream IP: <span style="color: var(--text-main);">192.168.1.100</span>
            </div>
        </div>
    </div>

    <!-- Active Sensor Nodes Telemetry Section -->
    <div class="card" style="margin-bottom: 20px;">
        <div class="card-title">ACTIVE SENSOR NODE TELEMETRY</div>
        <div class="nodes-grid" id="nodes-container"></div>
    </div>

    <!-- Real-time Trends Chart Section -->
    <div class="card">
        <div class="card-title">REAL-TIME HAZARD TRENDS (VIBRATION & DISTANCE)</div>
        <div class="chart-container">
            <canvas id="telemetryChart"></canvas>
        </div>
    </div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. MAP INITIALIZATION (OpenStreetMap - Free, No API Key Required) ---
        const map = L.map('map').setView([12.9716, 77.5946], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const nodeMarkers = {};

        // --- 2. CHART.JS INITIALIZATION ---
        const ctx = document.getElementById('telemetryChart').getContext('2d');
        const telemetryChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Vibration (g)', borderColor: '#ff1744', backgroundColor: 'rgba(255, 23, 68, 0.1)', data: [], fill: true },
                    { label: 'Distance (cm)', borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.1)', data: [], fill: true }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                    y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
                },
                plugins: { legend: { labels: { color: '#f1f5f9' } } }
            }
        });

        // --- 3. WEBSOCKET ENGINE & TELEMETRY UPDATES ---
        const ws = new WebSocket(`ws://${window.location.hostname}:8000`);
        const statusBadge = document.getElementById('status-badge');
        const container = document.getElementById('nodes-container');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // System Hazard Status Update
            statusBadge.className = `status-badge ${data.status}`;
            statusBadge.innerText = `Status: ${data.status.replace('_', ' ')}`;

            // Render Dynamic Node Cards & Map Markers
            container.innerHTML = '';
            
            for (const [nodeId, metrics] of Object.entries(data.nodes)) {
                // Populate Telemetry Cards
                container.innerHTML += `
                    <div style="background: rgba(255,255,255,0.02); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <h4 style="color: #38bdf8; margin-bottom: 10px;">${nodeId}</h4>
                        <div class="metric-row"><span>Water/Distance:</span><span class="metric-value">${metrics.dist} cm</span></div>
                        <div class="metric-row"><span>Temperature:</span><span class="metric-value">${metrics.temp} °C</span></div>
                        <div class="metric-row"><span>Rainfall Sensor:</span><span class="metric-value">${metrics.rain}</span></div>
                        <div class="metric-row"><span>Seismic Vibration:</span><span class="metric-value">${metrics.vib} g</span></div>
                    </div>
                `;

                // Update or Create Map Markers dynamically
                if (!nodeMarkers[nodeId]) {
                    nodeMarkers[nodeId] = L.marker([metrics.lat, metrics.lng]).addTo(map)
                        .bindPopup(`<b>${nodeId}</b><br>Monitoring Station`);
                } else {
                    nodeMarkers[nodeId].setLatLng([metrics.lat, metrics.lng]);
                }
            }

            // Real-Time Graph Plotting
            const timeStr = new Date().toLocaleTimeString();
            const firstNode = Object.values(data.nodes)[0];
            if (firstNode) {
                if (telemetryChart.data.labels.length > 12) {
                    telemetryChart.data.labels.shift();
                    telemetryChart.data.datasets[0].data.shift();
                    telemetryChart.data.datasets[1].data.shift();
                }
                telemetryChart.data.labels.push(timeStr);
                telemetryChart.data.datasets[0].data.push(firstNode.vib);
                telemetryChart.data.datasets[1].data.push(firstNode.dist);
                telemetryChart.data.update();
            }
        };
    </script>
</body>
</html>
